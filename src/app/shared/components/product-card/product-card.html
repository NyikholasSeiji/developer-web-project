<article class="group">
  <div class="relative overflow-hidden bg-bg-alt">
    <span class="absolute left-3 top-3 z-10 font-display text-xs italic text-ink/70">
      {{ catalogLabel() }}
    </span>

    @if (product().isOnSale) {
      <span class="absolute right-3 top-3 z-10 bg-ink px-2.5 py-1 text-[10px] uppercase tracking-[0.1em] text-bg">
        Promoção
      </span>
    }

    <img
      [src]="product().imageUrl"
      [alt]="product().name"
      loading="lazy"
      class="aspect-[4/5] w-full object-cover transition-transform duration-500 ease-out group-hover:scale-[1.04]"
    />

    <div class="absolute inset-x-0 bottom-0 translate-y-full bg-bg/95 p-3 text-center transition-transform duration-300 ease-out group-hover:translate-y-0">
      <button type="button" class="w-full text-[11px] uppercase tracking-[0.14em] text-ink">
        Ver produto
      </button>
    </div>
  </div>

  <div class="mt-4 flex items-start justify-between gap-2">
    <div>
      <p class="text-[11px] uppercase tracking-[0.1em] text-ink-soft">{{ product().category }}</p>
      <h3 class="mt-1 font-display text-base text-ink">{{ product().name }}</h3>
    </div>

    <div class="shrink-0 text-right">
      <p class="text-sm text-ink">{{ formattedPrice() }}</p>
      @if (formattedPreviousPrice(); as prev) {
        <p class="text-xs text-ink-soft line-through">{{ prev }}</p>
      }
    </div>
  </div>
</article>
