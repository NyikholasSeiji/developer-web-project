<section class="bg-surface-dark py-20 text-on-dark sm:py-28">
  <div class="mx-auto max-w-xl px-5 text-center sm:px-8">
    <p class="text-[11px] uppercase tracking-[0.14em] text-on-dark-soft">Lista de espera</p>
    <h2 class="mt-4 font-display text-3xl italic leading-tight sm:text-4xl">
      Seja o primeiro a saber dos próximos lançamentos.
    </h2>
    <p class="mt-4 text-sm text-on-dark-soft">
      Sem spam. Só peças novas, antes de todo mundo.
    </p>

    <form class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
      <input
        type="email"
        placeholder="seu@email.com"
        class="w-full border border-white/20 bg-transparent px-4 py-3 text-sm text-on-dark placeholder:text-on-dark-soft focus:outline-none focus:border-white/50 sm:w-72"
      />
      <app-button variant="inverted" type="submit">Inscrever-se</app-button>
    </form>
  </div>
</section>
