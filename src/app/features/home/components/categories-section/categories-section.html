<section class="border-b border-line py-16 sm:py-20">
  <div class="mx-auto max-w-7xl px-5 sm:px-8">
    <div class="mb-10 flex items-baseline justify-between">
      <div>
        <p class="text-[11px] uppercase tracking-[0.14em] text-ink-soft">02 — Categorias</p>
        <h2 class="mt-2 font-display text-3xl text-ink">Explore por categoria</h2>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4 sm:gap-5 lg:grid-cols-4">
      @for (category of categories(); track category.id) {
        <a [routerLink]="['/produtos']" [queryParams]="{ categoria: category.id }" class="group block">
          <div class="relative aspect-[3/4] overflow-hidden bg-bg-alt">
            <img
              [src]="category.imageUrl"
              [alt]="category.name"
              loading="lazy"
              class="h-full w-full object-cover transition-transform duration-500 ease-out group-hover:scale-[1.04]"
            />
          </div>
          <p class="mt-3 text-[13px] uppercase tracking-[0.1em] text-ink">{{ category.name }}</p>
        </a>
      }
    </div>
  </div>
</section>
