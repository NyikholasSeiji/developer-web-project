<section class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-5 py-16 sm:px-8">
  <p class="text-center text-[11px] uppercase tracking-[0.14em] text-ink-soft">Bem-vinda de volta</p>
  <h1 class="mt-4 text-center font-display text-3xl text-ink">Entrar na conta</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-10 flex flex-col gap-6" novalidate>
    <app-form-field
      label="E-mail"
      fieldId="login-email"
      type="email"
      autocomplete="email"
      [control]="form.controls.email"
    />
    <app-form-field
      label="Senha"
      fieldId="login-password"
      type="password"
      autocomplete="current-password"
      [control]="form.controls.password"
    />

    @if (errorMessage(); as message) {
      <p class="text-xs text-ink" role="alert">{{ message }}</p>
    }

    <app-button variant="primary" type="submit" [disabled]="loading()">
      {{ loading() ? 'Entrando…' : 'Entrar' }}
    </app-button>
  </form>

  <p class="mt-8 text-center text-sm text-ink-soft">
    Ainda não tem conta?
    <a routerLink="/cadastro" class="text-ink underline underline-offset-4">Criar conta</a>
  </p>

  <p class="mt-6 text-center text-xs text-ink-soft">
    Use <span class="text-ink">demo&#64;forme.com</span> / <span class="text-ink">123456</span> para testar.
  </p>
</section>
