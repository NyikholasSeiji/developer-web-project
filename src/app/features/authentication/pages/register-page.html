<section class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-5 py-16 sm:px-8">
  <p class="text-center text-[11px] uppercase tracking-[0.14em] text-ink-soft">Bem-vinda</p>
  <h1 class="mt-4 text-center font-display text-3xl text-ink">Criar conta</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-10 flex flex-col gap-6" novalidate>
    <app-form-field label="Nome" fieldId="register-name" autocomplete="name" [control]="form.controls.name" />
    <app-form-field
      label="E-mail"
      fieldId="register-email"
      type="email"
      autocomplete="email"
      [control]="form.controls.email"
    />
    <app-form-field
      label="Senha"
      fieldId="register-password"
      type="password"
      autocomplete="new-password"
      [control]="form.controls.password"
    />
    <app-form-field
      label="Confirmar senha"
      fieldId="register-confirm-password"
      type="password"
      autocomplete="new-password"
      [control]="form.controls.confirmPassword"
    />

    @if (errorMessage(); as message) {
      <p class="text-xs text-ink" role="alert">{{ message }}</p>
    }

    <app-button variant="primary" type="submit" [disabled]="loading()">
      {{ loading() ? 'Criando conta…' : 'Criar conta' }}
    </app-button>
  </form>

  <p class="mt-8 text-center text-sm text-ink-soft">
    Já tem conta?
    <a routerLink="/login" class="text-ink underline underline-offset-4">Entrar</a>
  </p>
</section>
