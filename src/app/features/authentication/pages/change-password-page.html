<section class="mx-auto flex min-h-[70vh] max-w-md flex-col justify-center px-5 py-16 sm:px-8">
  <p class="text-center text-[11px] uppercase tracking-[0.14em] text-ink-soft">Segurança</p>
  <h1 class="mt-4 text-center font-display text-3xl text-ink">Definir nova senha</h1>
  <p class="mt-3 text-center text-sm leading-relaxed text-ink-soft">
    Confirme seu e-mail e CPF para escolher uma nova senha.
  </p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-10 flex flex-col gap-6" novalidate>
    <app-form-field
      label="E-mail"
      fieldId="change-email"
      type="email"
      autocomplete="email"
      [control]="form.controls.email"
    />
    <app-form-field label="CPF" fieldId="change-cpf" [control]="form.controls.cpf" />
    <app-form-field
      label="Nova senha"
      fieldId="change-password"
      type="password"
      autocomplete="new-password"
      [control]="form.controls.newPassword"
    />
    <app-form-field
      label="Confirmar nova senha"
      fieldId="change-confirm"
      type="password"
      autocomplete="new-password"
      [control]="form.controls.confirmPassword"
    />

    @if (errorMessage(); as message) {
      <p class="text-xs text-ink" role="alert">{{ message }}</p>
    }

    <app-button variant="primary" type="submit" [disabled]="loading()">
      {{ loading() ? 'Salvando…' : 'Salvar nova senha' }}
    </app-button>
  </form>

  <p class="mt-8 text-center text-sm text-ink-soft">
    <a routerLink="/login" class="text-ink underline underline-offset-4">Voltar para o login</a>
  </p>
</section>
