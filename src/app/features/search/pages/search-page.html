<section class="mx-auto max-w-7xl px-5 py-16 sm:px-8 sm:py-20">
  <div class="mb-10">
    <p class="text-[11px] uppercase tracking-[0.14em] text-ink-soft">Busca</p>
    @if (q()) {
      <h1 class="mt-2 font-display text-3xl text-ink sm:text-4xl">
        Resultados para <span class="italic">"{{ q() }}"</span>
      </h1>
    } @else {
      <h1 class="mt-2 font-display text-3xl text-ink sm:text-4xl">Buscar produtos</h1>
      <p class="mt-3 max-w-[46ch] text-sm leading-relaxed text-ink-soft">
        Use o ícone de busca no topo da página para encontrar um produto pelo nome.
      </p>
    }
  </div>

  @if (isLoading()) {
    <app-loading-state label="Carregando produtos" />
  } @else if (q()) {
    <app-product-grid [products]="results()" [emptyMessage]="'Nenhum produto encontrado para &quot;' + q() + '&quot;.'" />
  }
</section>
