<section class="border-b border-line py-16 sm:py-24">
  <div class="mx-auto max-w-7xl px-5 sm:px-8">
    <div class="grid grid-cols-1 gap-12 sm:grid-cols-3 sm:gap-8">
      @for (value of values; track value.number) {
        <div class="border-t border-ink pt-6">
          <span class="font-display text-sm italic text-ink-soft">{{ value.number }}</span>
          <h3 class="mt-3 font-display text-xl text-ink">{{ value.title }}</h3>
          <p class="mt-3 text-sm leading-relaxed text-ink-soft">{{ value.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
