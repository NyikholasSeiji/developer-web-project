<section class="mx-auto max-w-xl px-5 py-16 sm:px-8 sm:py-20">
  <div class="mb-10">
    <p class="text-[11px] uppercase tracking-[0.14em] text-ink-soft">Minha conta</p>
    <h1 class="mt-2 font-display text-3xl text-ink sm:text-4xl">Perfil</h1>
  </div>

  @if (user(); as user) {
    <div class="border border-line divide-y divide-line">
      <div class="flex items-center justify-between px-6 py-4">
        <span class="text-xs uppercase tracking-[0.1em] text-ink-soft">Nome</span>
        <span class="text-sm text-ink">{{ user.name }}</span>
      </div>
      <div class="flex items-center justify-between px-6 py-4">
        <span class="text-xs uppercase tracking-[0.1em] text-ink-soft">E-mail</span>
        <span class="text-sm text-ink">{{ user.email }}</span>
      </div>
      @if (user.cpf) {
        <div class="flex items-center justify-between px-6 py-4">
          <span class="text-xs uppercase tracking-[0.1em] text-ink-soft">CPF</span>
          <span class="text-sm text-ink">{{ user.cpf }}</span>
        </div>
      }
      @if (user.phone) {
        <div class="flex items-center justify-between px-6 py-4">
          <span class="text-xs uppercase tracking-[0.1em] text-ink-soft">Telefone</span>
          <span class="text-sm text-ink">{{ user.phone }}</span>
        </div>
      }
    </div>

    <app-button variant="secondary" (click)="onLogout()" class="mt-8 inline-flex">
      Sair da conta
    </app-button>
  }
</section>
