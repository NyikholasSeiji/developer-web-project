<section class="mx-auto max-w-7xl px-5 py-16 sm:px-8 sm:py-20">
  <div class="mb-10">
    <p class="text-[11px] uppercase tracking-[0.14em] text-ink-soft">Catálogo</p>
    <h1 class="mt-2 font-display text-3xl text-ink sm:text-4xl">Categorias</h1>
  </div>

  @if (isLoading()) {
    <app-loading-state label="Carregando categorias" />
  } @else if (hasError()) {
    <app-service-unavailable
      title="Categorias temporariamente indisponíveis"
      message="Não conseguimos carregar as categorias agora. Tente novamente em instantes."
      (retry)="retry()"
    />
  } @else {
    <div class="grid grid-cols-2 gap-4 sm:gap-5 lg:grid-cols-4">
      @for (category of categoriesWithCount(); track category.id) {
        <a [routerLink]="['/produtos']" [queryParams]="{ categoria: category.id }" class="group block">
          <div class="relative aspect-[3/4] overflow-hidden bg-bg-alt">
            <img
              [src]="category.imageUrl"
              [alt]="category.name"
              loading="lazy"
              class="h-full w-full object-cover transition-transform duration-500 ease-out group-hover:scale-[1.04]"
            />
          </div>
          <p class="mt-3 text-[13px] uppercase tracking-[0.1em] text-ink">{{ category.name }}</p>
          <p class="text-xs text-ink-soft">
            {{ category.productCount }} {{ category.productCount === 1 ? 'produto' : 'produtos' }}
          </p>
        </a>
      }
    </div>
  }
</section>
